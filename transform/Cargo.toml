[package]
name = "jsx_control_statements"
version = "0.7.1"
edition = "2021"

[dependencies]
swc_core = { version = "64.0.0", features = ["ecma_plugin_transform"] }
tracing = { version = "0.1.44", features = ["release_max_level_off"] }

[dev-dependencies]
testing = "18.0.0"
swc_core = { version = "64.0.0", features = [
    "ecma_parser",
    "testing_transform",
] }

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(swc_ast_unknown)'] }
