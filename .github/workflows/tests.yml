name: Tests

on:
  push:
    branches: [ "main", "tmp/release" ]
  pull_request:
    branches: [ "main", "tmp/release" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Night toolchain
        run: rustup default nightly
      - name: Run tests (Main)
        run: cargo test
      - name: Run tests (Transformer)
        run: cd transform && cargo test
